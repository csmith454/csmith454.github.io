# Site settings
title: Another graduate student's blog.
email: colesmith828@gmail.com
description: >-
  A space for change.
baseurl: ""
url: "https://csmith454.github.io"
domain: csmith454.github.io
github_username: csmith454
author: Cole A. Smith

# Own layouts in _layouts/ are used; no remote theme.
theme: null

markdown: kramdown
permalink: /blog/:year/:month/:title/
timezone: America/Chicago

# (jekyll-tabs removed: it is not supported on GitHub Pages; tabs are now built into the layout.)
plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Cole A. Smith"

exclude:
  - Gemfile
  - Gemfile.lock
  - Gemfile~
  - README.md
  - LICENSE
  - vendor
  - _posts/_site

# Navigation tabs (order matters)
nav:
  - title: Home
    url: /
  - title: Blog
    url: /blog/
  - title: CV
    url: /cv/

# Landing-page details. Edit freely.
profile:
  name: Cole Smith
  tagline: M.A. candidate, Russian, East European & Eurasian Studies
  school: The University of Texas at Austin
  photo: /assets/images/profile.png
  location: Austin, TX
  github: csmith454
  linkedin: ""
