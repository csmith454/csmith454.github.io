<footer class="site-footer">
  <div class="container footer-inner">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.profile.name }}</span>
    <span class="footer-links">
      {% if site.profile.github != "" %}<a href="https://github.com/{{ site.profile.github }}">GitHub</a>{% endif %}
      {% if site.profile.linkedin != "" %}<a href="https://www.linkedin.com/in/{{ site.profile.linkedin }}">LinkedIn</a>{% endif %}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </span>
  </div>
</footer>
