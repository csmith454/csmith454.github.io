---
layout: default
---
<article class="post prose">
  <header class="post-header">
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% assign words = content | number_of_words %}
      · {{ words | divided_by: 220 | plus: 1 }} min read
    </p>
    {% if page.title %}<h1 class="page-title">{{ page.title | markdownify | remove: '<p>' | remove: '</p>' }}</h1>{% endif %}
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>

<div id="comments-section">
  <script src="https://utteranc.es/client.js"
          repo="csmith454/csmith454.github.io"
          issue-term="title"
          theme="preferred-color-scheme"
          crossorigin="anonymous"
          async>
  </script>
</div>
