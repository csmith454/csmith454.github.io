---
layout: page
title: Curriculum Vitae
subtitle:
permalink: /cv/
---
{% assign cv = '/assets/files/cv.pdf' | relative_url %}

<div class="btn-row" style="margin:0 0 20px">
  <a class="btn primary" href="{{ cv }}" download="{{ site.profile.name | replace: ' ', '_' }}_CV.pdf">Download PDF</a>
  <a class="btn" href="{{ cv }}" target="_blank" rel="noopener">Open in new tab</a>
</div>

<div class="cv-embed">
  <object data="{{ cv }}?v={{ site.time | date: '%s' }}#view=FitH" type="application/pdf" aria-label="CV">
    <p>Your browser can't display the PDF inline. <a href="{{ cv }}">Download it here</a>.</p>
  </object>
</div>
